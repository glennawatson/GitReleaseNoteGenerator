name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    uses: glennawatson/actions-common/.github/workflows/workflow-common-build-and-test.yml@d1a1652f1d0e4ad7d2f77bda30b58f4b42ab0748 # main
    with:
      runner: ${{ matrix.os }}
      solutionFile: GitReleaseNoteGenerator.slnx
      minverTagPrefix: v
      # The .NET 10 SDK supplies the runtime needed by the net10.0 tests.
      dotnetVersions: |
        10.0.x
        11.0.x
