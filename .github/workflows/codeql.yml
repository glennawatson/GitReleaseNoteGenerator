name: CodeQL Advanced

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 9 * * 2'

permissions:
  security-events: write
  contents: read
  packages: read
  actions: read

jobs:
  analyze:
    uses: glennawatson/actions-common/.github/workflows/workflow-common-codeql.yml@d1a1652f1d0e4ad7d2f77bda30b58f4b42ab0748 # main
    with:
      solutionFile: GitReleaseNoteGenerator.slnx
      csharpRunsOn: ubuntu-latest
