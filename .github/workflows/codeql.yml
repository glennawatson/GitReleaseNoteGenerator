name: CodeQL Advanced

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 9 * * 2'

permissions:
  security-events: write
  contents: read
  packages: read
  actions: read

jobs:
  analyze:
    uses: glennawatson/actions-common/.github/workflows/workflow-common-codeql.yml@4882558c56a8879548981c0dd01f99363d00b332 # main
    with:
      solutionFile: GitReleaseNoteGenerator.slnx
      csharpRunsOn: ubuntu-latest
