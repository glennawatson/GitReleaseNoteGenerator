name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    uses: glennawatson/actions-common/.github/workflows/workflow-common-sonarcloud.yml@4882558c56a8879548981c0dd01f99363d00b332 # main
    with:
      solutionFile: GitReleaseNoteGenerator.slnx
      runsOn: ubuntu-latest
      minverMinimumMajorMinor: '1.0'
      # The .NET 10 SDK supplies the runtime needed by the net10.0 tests.
      dotnetVersions: |
        10.0.x
        11.0.x
      sonarProjectKey: glennawatson_GitReleaseNoteGenerator
      sonarOrganization: glennawatson
      sonarExclusions: '**/tests/**'
      sonarCoverageExclusions: '**/tests/**'
      sonarCpdExclusions: '**/tests/**'
      sonarTestExclusions: '**/tests/**'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
